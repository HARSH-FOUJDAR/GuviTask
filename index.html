<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Welcome - Auth System</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .background-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      opacity: 0.35;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(255, 255, 255, 0.45);
      z-index: -1;
    }

    .welcome-card {
      margin-top: 100px;
      border: none;
      border-radius: 20px;
      background: transparent;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .welcome-title {
      color: #e7007e;
      font-weight: 700;
    }

    .welcome-text {
      color: darkblue;
      font-weight: 500;
      line-height: 1.7;
    }

    .user-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #e7007e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 35px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <script>
    window.location.href = "login.html";
  </script>
  <!-- Background -->
  <img class="background-image"
    src="https://png.pngtree.com/thumb_back/fw800/background/20251118/pngtree-team-of-programmers-collaborating-in-a-modern-office-environment-working-on-image_20426161.webp"
    alt="Programming team background">

  <div class="overlay"></div>


  <!-- Main Container -->
  <div class="container">

    <div class="row justify-content-center">

      <div class="col-md-8 col-lg-7">

        <div class="card welcome-card">

          <div class="card-body text-center p-5">

            <!-- User Icon -->
            <div class="user-icon">
              GV
            </div>

            <!-- Welcome Heading -->
            <h1 class="welcome-title mb-3">
              Welcome to the GV-Secure Authentication System!
            </h1>

            <!-- Welcome Message -->
            <p class="welcome-text">
              You have successfully logged in to your account.
              Your authentication was completed successfully.
            </p>

            <hr class="my-4">

            <!-- Information -->
            <div class="alert alert-info text-start">

              <h5 class="alert-heading">
                Account Access
              </h5>

              <p class="mb-0">
                You can now access your profile and manage your
                account information from the system.
              </p>

            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-center gap-3 mt-4">

              <a href="profile.html" class="btn btn-primary">
                View Profile
              </a>

              <button type="button" id="logoutBtn" class="btn btn-danger ms-lg-2">
                Logout
              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="js/logout.js"></script>
</body>

</html>
```
