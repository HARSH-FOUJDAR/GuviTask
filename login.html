<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #eef2f7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
  </style>
</head>

<body>
  <img class="background-image"
    src="https://png.pngtree.com/thumb_back/fw800/background/20251118/pngtree-team-of-programmers-collaborating-in-a-modern-office-environment-working-on-image_20426161.webp"
    alt="Programming team background">

  <div class="overlay"></div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card login-card">
          <div class="card-body">
            <h3 class="text-center mb-4">Login Here</h3>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter Your Email"
                  required />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                  placeholder="Enter Your Password" required />
              </div>

              <button type="submit" styele="
                  display: flex;
                  justify-content: center;
                  color: firebrick;
              " class="btn btn-primary w-100">
                Login
              </button>
              <p>pls wait... after login</p>

              <p class="text-center mt-3 mb-0">
                Don’t have an account?
                <a href="register.html" class="text-primary">Sign Up</a>
              </p>

              <div id="message" class="mt-3"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
