<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
<link rel="stylesheet" href="css/style.css">
  <style>

    body {
      min-height: 100vh;
      background-color: #f5f7fa;
    }

  </style>

</head>


<body>


  <div id="navbar"></div>

  <img
    class="background-image"
    src="https://png.pngtree.com/thumb_back/fw800/background/20251118/pngtree-team-of-programmers-collaborating-in-a-modern-office-environment-working-on-image_20426161.webp"
    alt="Programming team background"
  >

  <div class="overlay"></div>



  <div class="container">

    <div class="profile-container">

      <div class="card profile-card">




        <div class="profile-header">

          <div class="profile-icon">
            GV
          </div>

          <h2>
            My Profile
          </h2>

          <p class="mb-0">
            View and manage your account information
          </p>

        </div>



        <div class="profile-body">

          <form id="profileForm">




            <div class="mb-3">

              <label
                for="userId"
                class="form-label"
              >
                User ID
              </label>

              <input
                type="text"
                id="userId"
                name="userId"
                class="form-control"
                readonly
              >

            </div>


      

            <div class="mb-3">

              <label
                for="name"
                class="form-label"
              >
                Full Name
              </label>

              <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                placeholder="Enter your name"
                required
              >

            </div>


      

            <div class="mb-3">

              <label
                for="email"
                class="form-label"
              >
                Email
              </label>

              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
              >

            </div>


       

            <div class="mb-3">

              <label
                for="Mobile"
                class="form-label"
              >
                Mobile Number
              </label>

              <input
                type="text"
                id="Mobile"
                name="Mobile"
                class="form-control"
                placeholder="Enter your mobile number"
                maxlength="10"
                required
              >

            </div>


     
            <div class="mb-3">

              <label
                for="DOB"
                class="form-label"
              >
                Date of Birth
              </label>

              <input
                type="date"
                id="DOB"
                name="DOB"
                class="form-control"
                required
              >

            </div>


    

            <div class="mb-3">

              <label
                for="DateTime"
                class="form-label"
              >
                Registered On
              </label>

              <input
                type="text"
                id="DateTime"
                name="DateTime"
                class="form-control"
                readonly
              >

            </div>


        

            <div id="message"></div>


            <div class="d-flex gap-2 mt-4">

              <button
                type="submit"
                class="btn btn-primary"
              >
                Update Profile
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>


  <!-- jQuery -->
<script src="js/profile.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
