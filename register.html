<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="css/style.css">
</head>

</head>

<body>
  <img class="background-image"
    src="https://png.pngtree.com/thumb_back/fw800/background/20251118/pngtree-team-of-programmers-collaborating-in-a-modern-office-environment-working-on-image_20426161.webp"
    alt="Programming team background">

  <div class="overlay"></div>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card">
          <div class="card-body">
            <h2 class="text-center mb-4">Create Account</h2>

            <div id="message"></div>

            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input type="text" id="name" class="form-control" required placeholder="Your full name" />
              </div>

              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" required placeholder="you@example.com" />
              </div>

              <div class="mb-3">
                <label class="form-label" for="Mobile">Mobile</label>
                <input type="tel" id="Mobile" name="Mobile" class="form-control" required
                  placeholder="e.g. 9876543210" />
              </div>

              <div class="mb-3">
                <label class="form-label" for="DOB">Date of Birth</label>
                <input type="date" id="DOB" name="DOB" class="form-control" required />
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" required
                  placeholder="At least 8 characters" />
                <small class="text-muted">Use 8+ characters with a mix of letters, numbers & symbols.</small>
              </div>

              <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" required
                  placeholder="Re-enter your password" />
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Register
              </button>
            </form>

            <p class="text-center mt-4 mb-0">
              Already have an account?
              <a href="login.html" class="text-decoration-none">Login</a>
            </p>

            <p class="footer-note">
              By registering, you agree to our Terms & Privacy Policy.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/register.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');

    form.addEventListener('submit', function (e) {
      message.innerHTML = '';

      if (password.value !== confirmPassword.value) {
        e.preventDefault();
        message.innerHTML =
          '<div class="alert alert-danger mb-0">Passwords do not match.</div>';
        confirmPassword.focus();
        return;
      }

      if (password.value.length < 8) {
        e.preventDefault();
        message.innerHTML =
          '<div class="alert alert-danger mb-0">Password must be at least 8 characters.</div>';
        password.focus();
        return;
      }

    });
  </script>
</body>

</html>
